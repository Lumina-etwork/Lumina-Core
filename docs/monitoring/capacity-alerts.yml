groups:
  - name: lumina-capacity-planning
    rules:
      - alert: CapacityProjectionAboveThreshold
        expr: lumina_capacity_projected_utilization_bps >= 8500
        for: 10m
        labels:
          severity: warning
          service: capacity-planning
        annotations:
          summary: Capacity projection exceeds 85% utilization
          description: Planner forecasts capacity pressure within the configured horizon.
      - alert: CapacityPlannerLatencyHigh
        expr: histogram_quantile(0.99, rate(lumina_capacity_planner_duration_seconds_bucket[5m])) > 0.1
        for: 5m
        labels:
          severity: critical
          service: capacity-planning
        annotations:
          summary: Capacity planner P99 latency exceeds 100ms
          description: Bounded historical sample windows may be too large or caller-side aggregation is degraded.
