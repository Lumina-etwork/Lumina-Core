[package]
name = "lumina-consensus"
version = "0.1.0"
edition = "2021"
description = "BFT consensus engine with view-change quorum certificate validation for Lumina-Core"

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core", "serde"] }
rand = "0.8"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hex = "0.4"