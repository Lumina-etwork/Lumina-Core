[package]
name = "core-engine"
version = "0.1.0"
edition = "2021"
description = "Core engine layer — STUN/TURN relay, attestation, P2P networking primitives"

[dependencies]
ed25519-dalek = { version = "2", features = ["serde", "rand_core"] }
rand = "0.8"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.21"
hex = "0.4"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
lumina-audit = { path = "../src/audit_trail" }


[dev-dependencies]
arbitrary = { version = "1", features = ["derive"] }