[package]
name = "lumina_core"
version = "0.1.0"
edition = "2021"

[dependencies]
soroban-sdk.workspace = true
spin = "0.9.8"

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[workspace]
members = [
    "contracts/config_manager",
]

default-members = [
    "contracts/config_manager",
]

resolver = "2"

[workspace.dependencies]
soroban-sdk = { version = "26.1.0" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
