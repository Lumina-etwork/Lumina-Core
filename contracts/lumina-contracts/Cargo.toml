[package]
name = "lumina-contracts"
version = "0.1.0"
edition = "2021"
description = "On-chain IP anchoring and milestone escrow for the Lumina Network"
license = "MIT"
repository = "https://github.com/Lumina-etwork/Lumina-Core"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "22.0.11"

[dev-dependencies]
soroban-sdk = { version = "22.0.11", features = ["testutils"] }
