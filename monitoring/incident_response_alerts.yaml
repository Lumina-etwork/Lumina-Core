groups:
  - name: lumina-incident-response
    interval: 30s
    rules:
      - alert: LuminaCriticalPathP99LatencyHigh
        expr: histogram_quantile(0.99, sum(rate(lumina_request_duration_seconds_bucket[5m])) by (le, service)) > 0.100
        for: 2m
        labels:
          severity: critical
          pagerduty: enabled
        annotations:
          summary: "{{ $labels.service }} P99 latency exceeded 100ms"
          runbook: "docs/operations/incident-response-pagerduty.md"
      - alert: LuminaServiceAvailabilityBelowSlo
        expr: (sum(rate(lumina_requests_total{status!~"5.."}[5m])) by (service) / sum(rate(lumina_requests_total[5m])) by (service)) < 0.9999
        for: 2m
        labels:
          severity: critical
          pagerduty: enabled
        annotations:
          summary: "{{ $labels.service }} availability dropped below 99.99%"
          runbook: "docs/operations/incident-response-pagerduty.md"
      - alert: LuminaCanaryErrorBudgetBurn
        expr: lumina_canary_error_budget_burn_rate > 1
        for: 1m
        labels:
          severity: warning
          pagerduty: enabled
        annotations:
          summary: "Canary burn rate is above the deployment gate"
          runbook: "docs/operations/incident-response-pagerduty.md"
      - alert: LuminaBackupVerificationFailed
        expr: lumina_backup_verification_status == 0 and lumina_backup_verification_last_run_seconds > 0
        for: 10m
        labels:
          severity: critical
          pagerduty: enabled
        annotations:
          summary: "Scheduled backup verification has failed for {{ $labels.environment }}"
          description: "The latest backup verification run reported FAIL status. Check the verification report in backups/verification/ for details."
          runbook: "docs/runbooks/backup-verification.md"
      - alert: LuminaBackupVerificationMissing
        expr: (time() - lumina_backup_verification_last_run_seconds) > 90000
        for: 30m
        labels:
          severity: warning
          pagerduty: enabled
        annotations:
          summary: "No backup verification has completed in the last 25 hours"
          description: "The scheduled backup verification cron job may be down or stalled. Check the cron scheduler and verify_backup.sh logs."
          runbook: "docs/runbooks/backup-verification.md"
