groups:
  - name: ci-docker-layer-cache
    rules:

      # ── Hit rate bajo sostenido ──────────────────────────────────────────────
      - alert: CIDockerCacheHitRateLow
        expr: |
          rate(ci_docker_cache_hits_total[1h])
          / (rate(ci_docker_cache_hits_total[1h]) + rate(ci_docker_cache_misses_total[1h]))
          < 0.80
        for: 30m
        labels:
          severity: warning
          service: ci-infrastructure
        annotations:
          summary: "Docker layer cache hit rate por debajo del 80% por 30 minutos"
          description: >
            CI Docker layer cache hit rate es {{ printf "%.1f%%" (mul $value 100) }}.
            Una tasa baja sostenida indica churn en Cargo.lock, regresion en los nombres
            de scope, o presion de eviccion del cache GHA (limite 10 GB).
            Revisar configuracion de scope en los workflow files.
            Runbook: docs/runbooks/docker-layer-cache.md

      # ── Build de deps-cache lento ────────────────────────────────────────────
      - alert: CIDockerBuildDurationHigh
        expr: |
          histogram_quantile(0.99,
            rate(ci_docker_build_duration_seconds_bucket{stage="deps-cache"}[1h])
          ) > 600
        for: 15m
        labels:
          severity: warning
          service: ci-infrastructure
        annotations:
          summary: "CI Docker deps-cache build P99 supera 10 minutos"
          description: >
            La stage deps-cache esta tardando mas de 10 minutos en P99.
            Indica full cold-build por cache miss o cambio en Cargo.lock.
            Si es recurrente, revisar si Dependabot hace updates batch del lockfile.
            Runbook: docs/runbooks/docker-layer-cache.md

      # ── Cache base-toolchain sin refresh en 24h ──────────────────────────────
      - alert: CIDockerCacheStale
        expr: |
          time() - ci_docker_cache_last_push_timestamp_seconds{scope="lumina-base-toolchain"} > 86400
        for: 30m
        labels:
          severity: warning
          service: ci-infrastructure
        annotations:
          summary: "Base toolchain Docker layer cache sin refresh en 24 horas"
          description: >
            El scope lumina-base-toolchain no recibio un push exitoso en 24 horas.
            Puede indicar fallas en los workflows de CI que impiden poblar el cache.
            Revisar el historial de ejecuciones de CI.
            Runbook: docs/runbooks/docker-layer-cache.md

      # ── Release build completamente frio — critico ───────────────────────────
      - alert: CIDockerLayerCacheCriticalMiss
        expr: |
          rate(ci_docker_cache_misses_total{scope=~"lumina-release-final"}[30m]) > 0
          and on()
          rate(ci_docker_cache_hits_total{scope="lumina-base-toolchain"}[30m]) == 0
        for: 5m
        labels:
          severity: critical
          service: ci-infrastructure
        annotations:
          summary: "Release Docker build ejecutando completamente en frio sin cache"
          description: >
            Un build de release esta corriendo con cache miss total en todas las stages.
            Esto extenderia la duracion del pipeline de release en 20-40 minutos y puede
            impactar los SLOs de deployment.
            Investigar eviccion de cache GHA o misconfiguracion de scope.
            Runbook: docs/runbooks/docker-layer-cache.md
