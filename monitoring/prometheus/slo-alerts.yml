groups:
  - name: lumina-slo-burn-rate
    interval: 30s
    rules:
      - record: lumina:slo_error_ratio:5m
        expr: sum(rate(lumina_request_errors_total[5m])) by (service, environment) / sum(rate(lumina_requests_total[5m])) by (service, environment)
      - record: lumina:slo_error_ratio:1h
        expr: sum(rate(lumina_request_errors_total[1h])) by (service, environment) / sum(rate(lumina_requests_total[1h])) by (service, environment)
      - alert: LuminaSLOFastBurn
        expr: lumina:slo_error_ratio:5m / (1 - 0.9999) >= 14.4 and lumina:slo_error_ratio:1h / (1 - 0.9999) >= 14.4
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.service }} is rapidly burning SLO error budget"
          runbook_url: "docs/slo-monitoring.md"
      - alert: LuminaLatencyP99Breach
        expr: histogram_quantile(0.99, sum(rate(lumina_request_duration_seconds_bucket[5m])) by (le, service, environment)) > 0.1
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.service }} critical-path P99 latency exceeds 100 ms"
          runbook_url: "docs/slo-monitoring.md"
