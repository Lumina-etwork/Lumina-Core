name: Smart Contracts CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Install Stellar CLI
        run: |
          VERSION="22.1.0"
          ARCHIVE="stellar-cli-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          URL="https://github.com/stellar/stellar-cli/releases/download/v${VERSION}/${ARCHIVE}"

          wget "${URL}" -O "${ARCHIVE}"

          BIN_PATH="$(tar -tzf "${ARCHIVE}" | grep -E '(^|/)stellar(-cli)?$' | head -n 1 || true)"
          if [ -z "${BIN_PATH}" ]; then
            echo "Could not locate stellar CLI binary in ${ARCHIVE}"
            tar -tzf "${ARCHIVE}"
            exit 1
          fi

          tar -xzf "${ARCHIVE}"
          sudo install -m 0755 "${BIN_PATH}" /usr/local/bin/stellar
          stellar --version

      - name: Build Contract
        run: |
          cargo build --target wasm32-unknown-unknown --release

      - name: Run Formal Reentrancy Verification
        run: |
          cargo test -p vesting_contracts -- formal_reentrancy --nocapture

      - name: Run Unit Tests
        run: |
          cargo test --workspace
