name: Contracts WASM Build

on:
  push:
    paths:
      - "contracts/**"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    paths:
      - "contracts/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

env:
  RUST_VERSION: "1.91.0"
  STELLAR_CLI_VERSION: "22.1.0"

jobs:
  build-wasm:
    name: Build WASM — ${{ matrix.contract }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        contract:
          - grant_contracts
          - staking_contract
          - deposit_to_yield_adapter
          - insurance_treasury

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown,wasm32v1-none

      - name: Cache Cargo (${{ matrix.contract }})
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-wasm-${{ matrix.contract }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-wasm-${{ matrix.contract }}-

      - name: Cache Stellar CLI
        uses: actions/cache@v4
        id: stellar-cache
        with:
          path: ~/.cargo/bin/stellar
          key: stellar-cli-${{ env.STELLAR_CLI_VERSION }}

      - name: Install Stellar CLI (if not cached)
        if: steps.stellar-cache.outputs.cache-hit != 'true'
        run: cargo install --locked stellar-cli@${{ env.STELLAR_CLI_VERSION }}

      - name: Build ${{ matrix.contract }} (WASM)
        run: |
          cargo build -p ${{ matrix.contract }} \
            --target wasm32-unknown-unknown \
            --release

      - name: Verify WASM artifact
        run: |
          WASM_FILE=$(find target/wasm32-unknown-unknown/release -name "*.wasm" | head -1)
          if [ -z "$WASM_FILE" ]; then
            echo "ERROR: No WASM artifact found for ${{ matrix.contract }}"
            exit 1
          fi
          echo "WASM artifact: $WASM_FILE ($(du -sh $WASM_FILE | cut -f1))"

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-${{ matrix.contract }}
          path: target/wasm32-unknown-unknown/release/*.wasm
          retention-days: 7

  # Verifica que todos los contratos pasaron antes de mergear
  contracts-gate:
    name: All contracts passed
    runs-on: ubuntu-latest
    needs: [build-wasm]
    if: always()
    steps:
      - name: Check matrix results
        run: |
          if [[ "${{ needs.build-wasm.result }}" != "success" ]]; then
            echo "One or more contract builds failed"
            exit 1
          fi
          echo "All contract WASM builds passed"
