name: Security Audit

on:
  push:
    branches: [main]
  schedule:
    # Ejecuta cada lunes a las 08:00 UTC
    - cron: "0 8 * * 1"
  workflow_dispatch:

env:
  RUST_VERSION: "1.91.0"

jobs:
  # ── Auditoría de dependencias (cargo-audit) ─────────────────────────────────
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-audit-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit

  # ── Detección de secretos (gitleaks) ───────────────────────────────────────
  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Security doc tests ──────────────────────────────────────────────────────
  security-doc-tests:
    name: Security Doc Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32v1-none

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-sec-docs-${{ hashFiles('**/Cargo.lock') }}

      - name: Run security doc tests
        working-directory: doc_tests
        run: cargo test

  # ── Gate final de seguridad ─────────────────────────────────────────────────
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: [dependency-audit, secrets-scan, security-doc-tests]
    if: always()
    steps:
      - name: Evaluate security checks
        run: |
          FAILED=0
          if [[ "${{ needs.dependency-audit.result }}" != "success" ]]; then
            echo "dependency-audit FAILED"
            FAILED=1
          fi
          if [[ "${{ needs.secrets-scan.result }}" != "success" ]]; then
            echo "secrets-scan FAILED"
            FAILED=1
          fi
          if [[ "${{ needs.security-doc-tests.result }}" != "success" ]]; then
            echo "security-doc-tests FAILED"
            FAILED=1
          fi
          if [[ $FAILED -eq 1 ]]; then
            exit 1
          fi
          echo "All security checks passed"
