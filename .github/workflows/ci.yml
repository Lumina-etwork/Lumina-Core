name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  RUST_VERSION: "1.91.0"
  STELLAR_CLI_VERSION: "22.1.0"
  CARGO_TERM_COLOR: always

jobs:
  # ── 1. LINT (falla rápido) ──────────────────────────────────────────────────
  lint:
    name: Lint (clippy + rustfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
          targets: wasm32v1-none

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-lint-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ── 2. CORE INFRASTRUCTURE ─────────────────────────────────────────────────
  core-infra:
    name: Core Infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32v1-none

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-core-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-core-

      - name: Build consensus
        run: cargo build -p lumina-consensus

      - name: Test consensus
        run: cargo test -p lumina-consensus

      - name: Build audit trail
        run: cargo build -p lumina-audit

      - name: Test audit trail
        run: cargo test -p lumina-audit

      - name: Build core-engine
        run: cargo build -p core-engine

      - name: Test core-engine
        run: cargo test -p core-engine

  # ── 3. SMART CONTRACTS — Group A ───────────────────────────────────────────
  contracts-a:
    name: Contracts A (grant, staking, deposit, insurance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32v1-none,wasm32-unknown-unknown

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-contracts-a-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-contracts-a-

      - name: Install Stellar CLI
        uses: actions/cache@v4
        id: stellar-cli-cache
        with:
          path: ~/.cargo/bin/stellar
          key: stellar-cli-${{ env.STELLAR_CLI_VERSION }}

      - name: Install Stellar CLI (if not cached)
        if: steps.stellar-cli-cache.outputs.cache-hit != 'true'
        run: cargo install --locked stellar-cli@${{ env.STELLAR_CLI_VERSION }}

      - name: Build grant_contracts (WASM)
        run: cargo build -p grant_contracts --target wasm32-unknown-unknown --release

      - name: Test grant_contracts
        run: cargo test -p grant_contracts

      - name: Build staking_contract (WASM)
        run: cargo build -p staking_contract --target wasm32-unknown-unknown --release

      - name: Test staking_contract
        run: cargo test -p staking_contract

      - name: Build deposit_to_yield_adapter (WASM)
        run: cargo build -p deposit_to_yield_adapter --target wasm32-unknown-unknown --release

      - name: Test deposit_to_yield_adapter
        run: cargo test -p deposit_to_yield_adapter

      - name: Build insurance_treasury (WASM)
        run: cargo build -p insurance_treasury --target wasm32-unknown-unknown --release

      - name: Test insurance_treasury
        run: cargo test -p insurance_treasury

  # ── 4. BACKEND SERVICES ────────────────────────────────────────────────────
  backends:
    name: Backend Services (analytics + social)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [analytics, social]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Cargo (${{ matrix.service }})
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ matrix.service }}/target
          key: ${{ runner.os }}-cargo-${{ matrix.service }}-${{ hashFiles(format('{0}/Cargo.lock', matrix.service)) }}
          restore-keys: ${{ runner.os }}-cargo-${{ matrix.service }}-

      - name: Build ${{ matrix.service }}
        working-directory: ${{ matrix.service }}
        run: cargo build

      - name: Test ${{ matrix.service }}
        working-directory: ${{ matrix.service }}
        run: cargo test

  # ── 1.5. HOOK TESTS ──────────────────────────────────────────────────────────
  hook-tests:
    name: Pre-commit Hook Tests (BATS)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Install BATS and shellcheck
        run: |
          sudo apt-get install -y bats shellcheck
          bats --version

      - name: Run hook unit tests
        run: bats tests/hooks/

      - name: Lint hook scripts with shellcheck
        run: shellcheck --severity=warning scripts/hooks/*.sh

  # ── 5. INTEGRATION (depende de todos los anteriores) ───────────────────────
  integration:
    name: Integration & Doc Tests
    runs-on: ubuntu-latest
    needs: [lint, core-infra, contracts-a, backends, hook-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32v1-none

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-integration-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-integration-

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Run doc tests
        working-directory: doc_tests
        run: cargo test

      - name: Write job summary
        if: always()
        run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| core-infra | ${{ needs.core-infra.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| contracts-a | ${{ needs.contracts-a.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| backends | ${{ needs.backends.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| hook-tests | ${{ needs.hook-tests.result }} |" >> $GITHUB_STEP_SUMMARY
