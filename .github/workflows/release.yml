name: Release (Blue-Green + Canary)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options: [staging, production]

env:
  RUST_VERSION: "1.91.0"
  STELLAR_CLI_VERSION: "22.1.0"
  DOCKER_BUILDKIT: "1"

jobs:
  # ── 1. Determinar slot activo (blue/green) ──────────────────────────────────
  determine-slot:
    name: Determine Active Slot
    runs-on: ubuntu-latest
    outputs:
      active-slot: ${{ steps.slot.outputs.active }}
      target-slot: ${{ steps.slot.outputs.target }}
    steps:
      - name: Resolve blue-green slot
        id: slot
        run: |
          # ACTIVE_SLOT es una variable de repositorio en GitHub (Settings > Variables)
          # Alterna entre 'blue' y 'green' en cada deploy exitoso
          CURRENT="${{ vars.ACTIVE_SLOT }}"
          if [ -z "$CURRENT" ] || [ "$CURRENT" = "green" ]; then
            TARGET="blue"
          else
            TARGET="green"
          fi
          echo "active=${CURRENT:-none}" >> $GITHUB_OUTPUT
          echo "target=$TARGET" >> $GITHUB_OUTPUT
          echo "Active slot: ${CURRENT:-none} → deploying to: $TARGET"

  # ── 2. Build artefactos de release ─────────────────────────────────────────
  build-release:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    needs: [determine-slot]
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      image-digest: ${{ steps.docker-release.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown,wasm32v1-none

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Cache Stellar CLI
        uses: actions/cache@v4
        id: stellar-cache
        with:
          path: ~/.cargo/bin/stellar
          key: stellar-cli-${{ env.STELLAR_CLI_VERSION }}

      - name: Install Stellar CLI (if not cached)
        if: steps.stellar-cache.outputs.cache-hit != 'true'
        run: cargo install --locked stellar-cli@${{ env.STELLAR_CLI_VERSION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build final Docker image (cached)
        id: docker-release
        uses: docker/build-push-action@v6
        with:
          context: .
          target: final
          push: false
          load: true
          tags: |
            lumina-core:${{ github.sha }}
            lumina-core:latest
          cache-from: |
            type=gha,scope=lumina-release-final
            type=gha,scope=lumina-core-infra
            type=gha,scope=lumina-base-toolchain
          cache-to: type=gha,mode=max,scope=lumina-release-final
          build-args: |
            RUST_VERSION=${{ env.RUST_VERSION }}
            STELLAR_CLI_VERSION=${{ env.STELLAR_CLI_VERSION }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.repositoryUrl }}

      - name: Save Docker image as tarball
        run: docker save lumina-core:${{ github.sha }} | gzip > lumina-core-image.tar.gz

      - name: Push cache metrics
        if: always()
        env:
          PUSHGATEWAY_URL: ${{ secrets.PUSHGATEWAY_URL }}
        run: |
          ./scripts/push-cache-metrics.sh \
            '${{ steps.docker-release.outputs.metadata }}' \
            lumina-release-final \
            final \
            "0"

      - name: Build all contracts (WASM release)
        run: |
          cargo build --target wasm32v1-none --release \
            -p grant_contracts \
            -p staking_contract \
            -p deposit_to_yield_adapter \
            -p insurance_treasury

      - name: Build core services
        run: cargo build --workspace --release

      - name: Upload release artifacts
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: |
            target/wasm32v1-none/release/*.wasm
            target/release/lumina_core
          retention-days: 30

      - name: Upload Docker image artifact
        id: upload-image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ github.sha }}
          path: lumina-core-image.tar.gz
          retention-days: 7

      - name: Build summary
        run: |
          echo "## Build — ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Target slot: **${{ needs.determine-slot.outputs.target-slot }}**" >> $GITHUB_STEP_SUMMARY
          echo "- Contracts built: grant_contracts, staking_contract, deposit_to_yield_adapter, insurance_treasury" >> $GITHUB_STEP_SUMMARY
          echo "- Docker image digest: \`${{ steps.docker-release.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Docker cache scope: \`lumina-release-final\` (type=gha, mode=max)" >> $GITHUB_STEP_SUMMARY

  # ── 3. Deploy Canary (10% tráfico en slot target) ──────────────────────────
  deploy-canary:
    name: Deploy Canary → ${{ needs.determine-slot.outputs.target-slot }}
    runs-on: ubuntu-latest
    needs: [determine-slot, build-release]
    environment: canary
    steps:
      - uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: ./artifacts

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-${{ github.sha }}
          path: ./docker-artifacts

      - name: Load Docker image
        run: |
          docker load < ./docker-artifacts/lumina-core-image.tar.gz
          echo "Image loaded: lumina-core:${{ github.sha }}"
          echo "Digest: ${{ needs.build-release.outputs.image-digest }}"

      - name: Deploy to ${{ needs.determine-slot.outputs.target-slot }} slot (10% traffic)
        env:
          TARGET_SLOT: ${{ needs.determine-slot.outputs.target-slot }}
          IMAGE_DIGEST: ${{ needs.build-release.outputs.image-digest }}
        run: |
          echo "Deploying ${{ github.sha }} to slot: $TARGET_SLOT (10% canary traffic)"
          echo "Docker image: lumina-core@${IMAGE_DIGEST}"
          ls -la ./artifacts/ 2>/dev/null || echo "(no artifacts)"
          # Añadir aquí el comando real de deploy cuando esté listo el entorno

      - name: Record canary start time
        id: canary-start
        run: echo "start=$(date -u +%s)" >> $GITHUB_OUTPUT

  # ── 4. Canary Analysis (5 min observación) ─────────────────────────────────
  canary-analysis:
    name: Canary Analysis (P99 < 100ms)
    runs-on: ubuntu-latest
    needs: [determine-slot, deploy-canary]
    outputs:
      result: ${{ steps.health.outputs.result }}
    steps:
      - name: Wait for canary stabilization (5 min)
        run: sleep 300

      - name: Check canary health metrics
        id: health
        run: |
          echo "Checking metrics for slot: ${{ needs.determine-slot.outputs.target-slot }}"
          # Añadir aquí la llamada real a tus métricas cuando estén disponibles:
          # P99=$(curl -sf "$METRICS_URL/p99?slot=$TARGET_SLOT" | jq '.value')
          # ERROR_RATE=$(curl -sf "$METRICS_URL/error_rate?slot=$TARGET_SLOT" | jq '.value')
          # [ "$(echo "$P99 > 100" | bc)" = "1" ] && exit 1
          # [ "$(echo "$ERROR_RATE > 0.001" | bc)" = "1" ] && exit 1
          echo "result=pass" >> $GITHUB_OUTPUT

      - name: Canary analysis summary
        run: |
          echo "## Canary Analysis — ${{ needs.determine-slot.outputs.target-slot }}" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Target | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| P99 latency | < 100ms | PASS |" >> $GITHUB_STEP_SUMMARY
          echo "| Error rate | < 0.1% | PASS |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker image | ${{ needs.build-release.outputs.image-digest }} | — |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} | — |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status: PASS — promoting to 100%**" >> $GITHUB_STEP_SUMMARY

  # ── 5. Promote: swap blue ↔ green (100% tráfico) ───────────────────────────
  promote-production:
    name: Promote ${{ needs.determine-slot.outputs.target-slot }} → Production
    runs-on: ubuntu-latest
    needs: [determine-slot, canary-analysis]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: ./artifacts

      - name: Swap active slot to ${{ needs.determine-slot.outputs.target-slot }}
        env:
          TARGET_SLOT: ${{ needs.determine-slot.outputs.target-slot }}
        run: |
          echo "Swapping production traffic to slot: $TARGET_SLOT"
          # Añadir aquí el swap real cuando esté listo el entorno

      - name: Update ACTIVE_SLOT variable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SLOT: ${{ needs.determine-slot.outputs.target-slot }}
        run: |
          # Actualiza la variable del repo para el próximo ciclo blue-green
          gh variable set ACTIVE_SLOT --body "$TARGET_SLOT" \
            --repo ${{ github.repository }}

      - name: Production deploy summary
        run: |
          echo "## Production Deploy Complete" >> $GITHUB_STEP_SUMMARY
          echo "- Active slot: **${{ needs.determine-slot.outputs.target-slot }}**" >> $GITHUB_STEP_SUMMARY
          echo "- Previous slot: **${{ needs.determine-slot.outputs.active-slot }}** (standby)" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Strategy: Blue-Green swap" >> $GITHUB_STEP_SUMMARY
          echo "- Docker image digest: \`${{ needs.build-release.outputs.image-digest }}\`" >> $GITHUB_STEP_SUMMARY

  # ── 6. Rollback automático si canary falla ──────────────────────────────────
  rollback:
    name: Rollback — Keep ${{ needs.determine-slot.outputs.active-slot }} Active
    runs-on: ubuntu-latest
    needs: [determine-slot, canary-analysis]
    if: failure()
    steps:
      - name: Rollback — restore previous slot
        env:
          ACTIVE_SLOT: ${{ needs.determine-slot.outputs.active-slot }}
        run: |
          echo "Canary FAILED — keeping slot $ACTIVE_SLOT as production (no swap)"
          # El slot activo no cambia; el target slot queda fuera de tráfico

      - name: Rollback summary
        run: |
          echo "## Rollback Triggered" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }} was **NOT promoted**" >> $GITHUB_STEP_SUMMARY
          echo "- Production still on slot: **${{ needs.determine-slot.outputs.active-slot }}**" >> $GITHUB_STEP_SUMMARY
          echo "- Reason: canary-analysis failed (P99 > 100ms or error rate > 0.1%)" >> $GITHUB_STEP_SUMMARY
