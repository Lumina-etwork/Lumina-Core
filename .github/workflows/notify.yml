name: Notifications

on:
  workflow_run:
    workflows: ["CI", "Security Audit", "Release (Blue-Green + Canary)"]
    types: [completed]
    branches: [main]

jobs:
  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - name: Build failure message
        id: msg
        run: |
          echo "workflow=${{ github.event.workflow_run.name }}" >> $GITHUB_OUTPUT
          echo "run_url=${{ github.event.workflow_run.html_url }}" >> $GITHUB_OUTPUT
          echo "branch=${{ github.event.workflow_run.head_branch }}" >> $GITHUB_OUTPUT
          echo "commit=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT

      # ── Slack (opcional) ───────────────────────────────────────────────────
      # Para activar: añade SLACK_WEBHOOK_URL en Settings > Secrets
      - name: Notify Slack
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": ":red_circle: *${{ steps.msg.outputs.workflow }}* failed on `${{ steps.msg.outputs.branch }}`",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":red_circle: *${{ steps.msg.outputs.workflow }}* failed\n*Branch:* `${{ steps.msg.outputs.branch }}`\n*Commit:* `${{ steps.msg.outputs.commit }}`\n*Logs:* <${{ steps.msg.outputs.run_url }}|Ver en GitHub>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      # ── Discord (opcional) ─────────────────────────────────────────────────
      # Para activar: añade DISCORD_WEBHOOK_URL en Settings > Secrets
      - name: Notify Discord
        if: ${{ secrets.DISCORD_WEBHOOK_URL != '' }}
        run: |
          curl -s -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"❌ ${{ steps.msg.outputs.workflow }} failed\",
                \"color\": 15158332,
                \"fields\": [
                  { \"name\": \"Branch\", \"value\": \"\`${{ steps.msg.outputs.branch }}\`\", \"inline\": true },
                  { \"name\": \"Commit\", \"value\": \"\`${{ steps.msg.outputs.commit }}\`\", \"inline\": true }
                ],
                \"url\": \"${{ steps.msg.outputs.run_url }}\"
              }]
            }"

  notify-success:
    name: Notify Deploy Success
    runs-on: ubuntu-latest
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.name == 'Release (Blue-Green + Canary)'
    steps:
      - name: Notify Discord (deploy exitoso)
        if: ${{ secrets.DISCORD_WEBHOOK_URL != '' }}
        run: |
          curl -s -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"✅ Deploy to production successful\",
                \"color\": 3066993,
                \"fields\": [
                  { \"name\": \"Branch\", \"value\": \"\`${{ github.event.workflow_run.head_branch }}\`\", \"inline\": true },
                  { \"name\": \"Commit\", \"value\": \"\`${{ github.event.workflow_run.head_sha }}\`\", \"inline\": true }
                ],
                \"url\": \"${{ github.event.workflow_run.html_url }}\"
              }]
            }"
