name: Coverage

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  COVERAGE_THRESHOLD: "70"

jobs:
  rust-coverage:
    name: Rust coverage threshold
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate workspace coverage
        run: |
          mkdir -p target/llvm-cov
          cargo llvm-cov --workspace --all-features --summary-only --output-path target/llvm-cov/coverage-summary.txt

      - name: Enforce coverage threshold
        run: scripts/check_coverage_threshold.sh target/llvm-cov/coverage-summary.txt "$COVERAGE_THRESHOLD"

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage-summary
          path: target/llvm-cov/coverage-summary.txt
          if-no-files-found: warn
